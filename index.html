<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOEFL 105 トレーナー</title>
<meta name="theme-color" content="#172A5C" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111B36" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TOEFL 105">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: one 720px column of answer-sheet cards on cool paper; fixed section tabs (Go / Aa / R / L / W / S) at the bottom; the accent (a calm orange, --hl) marks the target and the active choice */
  /* theme color: navy (紺). --ink is the navy used for text, buttons and charts; --bar / --bar-ink are the header band */
  --paper:#F2F4FA; --card:#FFFFFF; --ink:#172A5C; --muted:#5A6687; --line:#D5DBEA; --soft:#E8ECF6;
  --bar:#172A5C; --bar-ink:#FFFFFF;
  --hl:#E8944A; --hl-ink:#172A5C;
  --good:#167A4A; --good-bg:#E2F3E9; --bad:#B9361D; --bad-bg:#FBE6E0;
  --f-display:'Source Serif 4',Georgia,'Times New Roman',serif; /* numerals and heading letters; always rendered at weight 600 (replaced Instrument Serif) */
  --f-ui:'BIZ UDPGothic','Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif;
  --f-text:'Source Serif 4',Georgia,'Times New Roman',serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0A1124; --card:#111B36; --ink:#E7ECF7; --muted:#9BA7C2; --line:#2A3760; --soft:#1A2648;
    --bar:#111B36; --bar-ink:#E7ECF7;
    --good:#4CC38A; --good-bg:#11301F; --bad:#FF8466; --bad-bg:#3A1C15; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0A1124; --card:#111B36; --ink:#E7ECF7; --muted:#9BA7C2; --line:#2A3760; --soft:#1A2648;
  --bar:#111B36; --bar-ink:#E7ECF7;
  --good:#4CC38A; --good-bg:#11301F; --bad:#FF8466; --bad-bg:#3A1C15; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
h3{font-size:13px;margin:0 0 4px;color:var(--muted);letter-spacing:.03em}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px;background:var(--bar);color:var(--bar-ink);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap;min-width:0}
.brand-mark{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1;background:var(--hl);color:var(--hl-ink);padding:3px 6px 1px;border-radius:3px}
@media (max-width:419px){.brand-tail{display:none}}
.chips{display:flex;gap:6px;flex-wrap:nowrap;justify-content:flex-end;flex:none}
.chip{font-size:11.5px;padding:3px 8px;border:1px solid var(--line);border-radius:999px;white-space:nowrap;background:var(--card);color:var(--ink);text-decoration:none;cursor:pointer}
.chip.quiet{color:var(--muted)}
.chip.ok{border-color:var(--good);color:var(--good)}
.chip.err{border-color:var(--bad);color:var(--bad)}
main{max-width:720px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
main:focus{outline:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(6,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:10.5px;padding:2px 0}
.tabs b{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1;min-width:36px;text-align:center;padding:5px 4px 3px;border-radius:4px}
.tabs a.on{color:var(--ink);font-weight:700}
.tabs a.on b{background:var(--hl);color:var(--hl-ink)}
.sec-head{display:flex;align-items:flex-end;gap:12px;padding-top:2px}
.sec-letter{font-family:var(--f-display);font-weight:600;font-size:58px;line-height:.82}
.sec-head h1{margin:0;font-size:20px;line-height:1.25}
.sec-head p{margin:3px 0 0;color:var(--muted);font-size:12.5px;line-height:1.45}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:15.5px}
.card p{margin:0}
.inset{background:var(--soft);border:0}
.muted{color:var(--muted)}
.small{font-size:12.5px;line-height:1.55}
.err{color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:700;font-size:14px;cursor:pointer;min-height:42px;line-height:1.3}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.ghost{border-color:var(--line)}
.btn.sm{padding:4px 10px;min-height:32px;font-size:12.5px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px}
.seg button{flex:1 1 0;min-width:0;min-height:40px;border:0;background:transparent;padding:6px 6px;border-radius:7px;font-size:12.5px;font-weight:700;line-height:1.25;color:var(--muted);cursor:pointer;text-wrap:balance}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}
body:not(.has-ai) .ai-only{display:none!important}
body.has-ai .no-ai{display:none!important}
body:not(.has-dict) .dict-only{display:none!important}
body.has-dict .no-dict{display:none!important}
body:not(.has-audio) .audio-only{display:none!important}
body.has-audio .no-audio{display:none!important}

/* hero */
.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.05em}
.hero-main{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.old{font-family:var(--f-display);font-weight:600;font-size:44px;line-height:1;color:var(--muted)}
.arrow{font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--muted)}
.big{font-family:var(--f-display);font-weight:600;font-size:86px;line-height:.95;letter-spacing:-.02em;font-variation-settings:"opsz" 60}
.big span{background:linear-gradient(transparent 62%,var(--hl) 62%,var(--hl) 92%,transparent 92%);padding:0 6px}
.hero-sub{font-size:13.5px}
.facts{margin:0;padding-left:1.1em;font-size:13px;display:flex;flex-direction:column;gap:3px}
.conc{width:100%;border-collapse:collapse;font-family:var(--f-display);font-weight:600;font-size:12px;font-variant-numeric:tabular-nums;letter-spacing:0}
.conc th,.conc td{padding:5px 1px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.conc th{color:var(--muted);font-weight:600}
.conc tr.t td{font-weight:600}
.conc tr.t td:first-child span{background:var(--hl);color:var(--hl-ink);padding:1px 5px;border-radius:3px}
.scroll-x{overflow-x:auto}
.ladder{width:100%;height:auto;display:block}
.ladder text{font-family:var(--f-ui);font-size:10px;fill:var(--muted)}
.ladder .axis,.ladder .tk{stroke:var(--ink);stroke-width:1.2}
.ladder .zone{fill:var(--hl)}
.ladder .zl{fill:var(--hl-ink);font-weight:700}
.ladder .mk circle{fill:var(--ink)}
.ladder .mk text{fill:var(--paper);font-family:var(--f-display);font-weight:600;font-size:14px}
.ladder .ov{fill:var(--ink)}
.ladder .ovt{fill:var(--ink);font-weight:700;font-size:11px}
.mk{animation:slide .8s cubic-bezier(.2,.8,.2,1) both}
.mk.still{animation:none}
@keyframes slide{from{transform:translateX(-26px);opacity:.35}to{transform:none;opacity:1}}
.bands{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.bands{grid-template-columns:repeat(4,1fr)}}
.band{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px}
.band .top-line{display:flex;justify-content:space-between;align-items:baseline}
.band .k{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1}
.band .v{font-family:var(--f-display);font-weight:600;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.stepper{display:flex;gap:6px}
.stepper button{flex:1;height:34px;border:1px solid var(--line);background:var(--card);border-radius:6px;font-size:18px;cursor:pointer;color:var(--ink)}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plan li{border-bottom:1px solid var(--line)}
.plan li:last-child{border-bottom:0}
.plan-row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 0;min-height:48px;border:0;background:none;color:var(--ink);text-align:left;cursor:pointer;font-size:14px;line-height:1.4}
.chev{color:var(--muted);font-size:20px;line-height:1;flex:none;margin-left:-2px}
.today-meta{font-size:12px;color:var(--muted);letter-spacing:.03em}
.meter.lg{height:8px;border-radius:4px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;line-height:1.5;padding:0 6px;border-radius:999px;border:1px solid var(--bad);color:var(--bad);white-space:nowrap;vertical-align:1px}
.hint{display:flex;align-items:center;gap:10px;border-left:3px solid var(--bad);background:var(--bad-bg);border-radius:0 8px 8px 0;padding:8px 10px;font-size:13px;line-height:1.5}
.hint>span{flex:1;min-width:0}
.empty{font-size:13px;color:var(--muted);background:var(--soft);border-radius:8px;padding:10px 12px}
.btn.next-go{min-height:56px;font-size:16px}
.plan .lbl .sub{display:block;font-size:11.5px;color:var(--muted)}
details.card{display:block}
details.card>summary{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;list-style:none;font-size:13.5px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"＋";color:var(--muted);flex:none}
details.card[open]>summary::after{content:"−"}
.desk[open] .plan{margin-top:6px}
.wlist li .small{white-space:nowrap}
.tick{width:22px;height:22px;border:1.5px solid var(--ink);border-radius:4px;display:grid;place-items:center;flex:none;font-size:13px;font-weight:700}
.plan li.done .tick{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.plan li.done .lbl{color:var(--muted);text-decoration:line-through}
.plan .lbl{flex:1;min-width:0}
.plan .sec{font-family:var(--f-display);font-weight:600;font-size:17px;width:22px;text-align:center;flex:none}
.prog{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;white-space:nowrap}
table.stats{width:100%;border-collapse:collapse;font-size:13px}
.stats td,.stats th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.stats th{font-weight:400;color:var(--muted);font-size:12px}
.stats td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;min-width:56px}
.meter i{display:block;height:100%;background:var(--ink)}
.bars text{font-size:9.5px;fill:var(--muted);font-family:var(--f-ui)}
.bars .b{fill:var(--ink)}
.bars .b.today{fill:var(--hl);stroke:var(--ink);stroke-width:1}
.bars .base{stroke:var(--line)}
.field{display:flex;flex-direction:column;gap:4px}
.field input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);font-size:16px;min-height:42px}
.stat-row{display:flex;gap:18px;flex-wrap:wrap}
.stat-row div{display:flex;flex-direction:column}
.stat-row b{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.stat-row span{font-size:11.5px;color:var(--muted)}
/* record (#record): the calendar shades days in ink only; the picked day gets an ink ring, never the highlighter */
.stat-row.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.cal{display:block;width:100%;max-width:460px;height:auto;align-self:center}
.cal text{font-family:var(--f-ui);font-size:10px;fill:var(--muted);text-anchor:middle}
.cal g[data-act]{cursor:pointer}
.cal .c{fill:var(--soft)}
.cal .l1 .c{fill:var(--ink);fill-opacity:.15}
.cal .l2 .c{fill:var(--ink);fill-opacity:.35}
.cal .l3 .c{fill:var(--ink);fill-opacity:.65}
.cal .l4 .c{fill:var(--ink)}
.cal .l1 text,.cal .l2 text{fill:var(--ink)}
.cal .l3 text,.cal .l4 text{fill:var(--card)}
.cal text.n{font-family:var(--f-display);font-weight:600;font-size:12px;font-variant-numeric:tabular-nums}
.cal text.td{font-weight:700}
.cal .ls .c{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:.1 3.2;stroke-linecap:round}
.cal .fut{opacity:.35}
.cal .ring{fill:none;stroke:var(--ink);stroke-width:1.5}
.rec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:14px}
#recDay{display:flex;flex-direction:column;gap:6px}
.stack{display:flex;height:14px}
.stack i{display:block;flex:0 1 0;min-width:3px;background:var(--ink)}
.stack i:first-child{border-top-left-radius:4px;border-bottom-left-radius:4px}
.stack i:last-child{border-top-right-radius:4px;border-bottom-right-radius:4px}
.stack-key{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:4px 16px;font-size:13px}
.stack-key li{display:flex;align-items:center;gap:6px}
.stack-key li i{width:10px;height:10px;border-radius:2px;background:var(--ink);flex:none}
.stack-key li b{margin-left:auto;font-variant-numeric:tabular-nums}
.stack .k1,.stack-key .k1{opacity:.65}
.stack .k2,.stack-key .k2{opacity:.3}
.stack .k3,.stack-key li .k3{background:transparent;border:1px solid var(--line)}

/* vocab */
.flash{min-height:250px;justify-content:center;text-align:center;gap:10px}
/* headword: the same serif as the example sentences, semibold at the display optical size; .long (13+ letters or a phrase) steps down so it never breaks mid-word at 375px */
.flash .word{font-family:var(--f-text);font-weight:600;font-variation-settings:'opsz' 60;font-size:clamp(34px,11.5vw,46px);line-height:1.15;letter-spacing:-.01em;overflow-wrap:break-word}
.flash .word.long{font-size:clamp(26px,8.8vw,36px);letter-spacing:-.015em}
.flash .pos{font-family:var(--f-text);font-style:italic;font-size:15px;color:var(--muted)}
.flash .ja{font-size:19px;font-weight:700;line-height:1.5;margin-top:4px}
.flash .ex{font-family:var(--f-text);font-size:16px;line-height:1.65}
.flash .ex mark{background:var(--hl);color:var(--hl-ink);padding:0 2px;border-radius:2px}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade.g2,.grade.g4{grid-template-columns:repeat(2,1fr)}
.grade .btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.undo{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left}
.grade .btn small{font-weight:400;font-size:11px;opacity:.75}
.boxes{display:inline-flex;gap:3px;vertical-align:middle}
.boxes i{width:7px;height:7px;border-radius:2px;background:var(--line)}
.boxes i.f{background:var(--ink)}
.wlist{list-style:none;margin:0;padding:0;max-height:420px;overflow:auto}
.wlist li{display:flex;gap:10px;align-items:baseline;padding:7px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.wlist li b{font-family:var(--f-text);font-size:15px;font-weight:600;min-width:110px}
.wlist li span.j{flex:1}
details summary{cursor:pointer;font-weight:700;font-size:14px}

/* reading */
.passage{font-family:var(--f-text);font-size:17px;line-height:1.95}
.passage p{margin:0 0 12px}
.passage p:last-child{margin:0}
.pn{font-family:var(--f-ui);font-size:11px;color:var(--muted);margin-right:6px}
.ct{white-space:nowrap}
.ct input{border:0;border-bottom:2px dashed var(--muted);background:var(--soft);font-family:var(--f-text);font-size:17px;padding:0 1px;margin:0 1px 0 0;border-radius:3px 3px 0 0;line-height:1.3}
.ct input.ok{border-bottom:2px solid var(--good);background:var(--good-bg)}
.ct input.ng{border-bottom:2px solid var(--bad);background:var(--bad-bg)}
.ct .ans{font-family:var(--f-ui);font-size:11px;color:var(--bad);vertical-align:super;margin-left:1px;font-weight:700}
.doc{border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:6px;padding:14px;background:var(--card);font-family:var(--f-text);font-size:16px;line-height:1.65;white-space:pre-wrap}
.doc-kind{font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.doc-title{font-family:var(--f-ui);font-weight:700;font-size:15px}
.q{display:flex;flex-direction:column;gap:6px;padding:12px 0 2px;border-top:1px solid var(--line)}
.q .qt{font-weight:700;font-size:14.5px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;font-size:14.5px;line-height:1.5;color:var(--ink)}
.opt .L{font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.15;min-width:14px}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default;opacity:1;color:var(--ink)}
.exp{font-size:13px;background:var(--soft);border-radius:8px;padding:8px 10px;line-height:1.6}
.result{font-weight:700;font-size:15px}
.result b{font-family:var(--f-display);font-size:30px;font-weight:600}
.ctx{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.ctx[open] summary{margin-bottom:10px}
.ctx .passage{font-size:16px;line-height:1.85}

/* listening */
.player{display:flex;align-items:center;gap:14px}
.play{width:62px;height:62px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);display:grid;place-items:center;cursor:pointer;flex:none}
.play svg{width:24px;height:24px;fill:currentColor}
.play.on{background:var(--hl);color:var(--hl-ink)}
.script{font-family:var(--f-text);font-size:15.5px;line-height:1.7;background:var(--soft);border-radius:8px;padding:10px 12px;margin:0}
.script p{margin:0 0 6px}
.script p:last-child{margin:0}
.script b{font-family:var(--f-ui);font-size:11.5px;color:var(--muted);margin-right:6px}
/* hands-free listening (#listen): the line being spoken is marked with an ink rule, never the highlighter */
.lsn-top{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lsn-now{display:flex;flex-direction:column;gap:6px;min-height:190px}
.lsn-now p{padding:2px 0 2px 10px;border-left:3px solid transparent;color:var(--muted)}
.lsn-now p.cur{color:var(--ink);border-left:3px solid var(--ink)}
.lsn-now .w{font-family:var(--f-display);font-weight:600;font-size:32px;line-height:1.2;overflow-wrap:break-word}
.lsn-now .s{font-family:var(--f-text);font-size:17px;line-height:1.6}
.lsn-now .j{font-family:var(--f-ui);font-size:16px;line-height:1.6}
.lsn-now .g{font-family:var(--f-ui);font-size:14px;font-weight:700;line-height:1.6}   /* recall mode: the pause prompt */
.lsn-ctl{display:flex;justify-content:center;align-items:center;gap:20px;padding:4px 0}
.lsn-ctl .play{width:76px;height:76px}
.lsn-ctl .play svg{width:30px;height:30px}
.lsn-ctl .play:disabled{opacity:.45;cursor:default}
.lsn-ctl .sk{width:60px;height:60px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.lsn-ctl .sk svg{width:26px;height:26px;fill:currentColor}
.lsn-ctl .sk:disabled{opacity:.45;cursor:default}
#lsnStat{text-align:center}
button[data-r=listen] small{font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;color:var(--ink)}
.item .ty{font-size:11px;color:var(--muted);display:block}
.item .tt{font-weight:700;font-size:14px}
.item .badge{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}

/* writing */
.bubble{background:var(--soft);border-radius:12px 12px 12px 3px;padding:10px 12px;font-family:var(--f-text);font-size:16px;align-self:flex-start;max-width:94%}
.bubble b{font-family:var(--f-ui);font-size:11.5px;color:var(--muted);margin-right:6px}
.resp{font-family:var(--f-text);font-size:16.5px;line-height:2.5}
.resp b{font-family:var(--f-ui);font-size:11.5px;color:var(--muted);margin-right:6px}
.slot{display:inline-block;min-width:46px;border:0;border-bottom:2px solid var(--ink);background:transparent;margin:0 3px;padding:0 5px;line-height:1.45;cursor:pointer;font-family:var(--f-text);font-size:16.5px;color:var(--ink);vertical-align:baseline}
.slot.filled{background:var(--hl);color:var(--hl-ink);border-radius:3px 3px 0 0}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{border:1px solid var(--ink);background:var(--card);border-radius:6px;padding:7px 11px;font-family:var(--f-text);font-size:16px;cursor:pointer;color:var(--ink)}
.tile:disabled{opacity:.22;cursor:default}
.prompt-box{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.prompt-box ul{margin:0;padding-left:1.2em}
.prompt-box .to{font-family:var(--f-text);font-size:15px}
textarea.write{width:100%;min-height:230px;border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--f-text);font-size:16px;line-height:1.6;background:var(--card);resize:vertical}
textarea.write.sm{min-height:120px}
textarea.write[readonly]{background:var(--soft)}
input.line{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--f-text);font-size:16px;background:var(--card)}
select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--card);font-size:15px;min-height:42px;max-width:100%}
.timer{font-family:var(--f-display);font-weight:600;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.timer.sm{font-size:24px}
.timer.warn{color:var(--bad)}
.wc{font-variant-numeric:tabular-nums;font-weight:700}
.post{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px}
.post .who{font-size:12px;font-weight:700;color:var(--muted)}
.post .txt{font-family:var(--f-text);font-size:15.5px;line-height:1.6}
.post.prof{border-left:4px solid var(--ink)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.checks label{display:flex;gap:8px;align-items:flex-start}
.checks input{width:18px;height:18px;margin-top:2px;flex:none}
.fb{display:flex;flex-direction:column;gap:12px}
.score{display:flex;align-items:baseline;gap:6px}
.score .n{font-family:var(--f-display);font-weight:600;font-size:58px;line-height:1}
.fb ul{margin:0;padding-left:1.2em;font-size:13.5px}
.fb li{margin:2px 0}
.fb .pt.ok b{color:var(--good)}
.fb .pt.ng b{color:var(--bad)}
.corr{display:flex;flex-direction:column;gap:8px}
.corr div{border-left:3px solid var(--hl);padding:2px 10px;font-size:13.5px;line-height:1.55}
.corr del{color:var(--bad)}
.corr ins{text-decoration:none;color:var(--good);font-weight:700}
.model{font-family:var(--f-text);font-size:15.5px;line-height:1.7;white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.hist{list-style:none;margin:0;padding:0}
.hist li{border-bottom:1px solid var(--line);padding:8px 0}
.hist li:last-child{border-bottom:0}

/* speaking */
.diff{font-family:var(--f-text);font-size:16.5px;line-height:1.8}
.diff span{padding:0 2px;border-radius:2px}
.diff .hit{background:var(--good-bg)}
.diff .miss{background:var(--bad-bg);text-decoration:underline wavy var(--bad)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;background:var(--card);cursor:pointer;color:var(--ink)}
.pill.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--good)}
.dots i.mid{background:var(--hl)}
.dots i.ng{background:var(--bad)}
.dots i.cur{outline:2px solid var(--ink);outline-offset:1px}
.rec-on{background:var(--bad)!important;border-color:var(--bad)!important;color:#fff!important}
.working::after{content:'';display:inline-block;width:10px;height:10px;margin-left:8px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
textarea.backup{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--card)}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:9}
#toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

{id:"c3",title:"Glaciers",text:"Glaciers are massive bodies of ice that move slowly across the land under their own weight. As they advance, they scrape the ground beneath them and carry rocks and soil over great distances. When the climate warms and the ice melts, these materials are left behind in large piles called moraines. Geologists study such deposits to reconstruct the extent of ancient ice sheets."},
{id:"c4",title:"Memory",text:"Researchers have long been interested in how people form memories of everyday events. Studies suggest that memories are not stored like photographs but are rebuilt each time they are recalled. During this process, details can be lost, changed, or even added without the person noticing. This explains why two witnesses may describe the same event in very different ways."},
{id:"c5",title:"Distant Planets",text:"Astronomers estimate that most stars in our galaxy have at least one planet orbiting them. Detecting these distant worlds is difficult because they are small and do not produce their own light. One common method is to measure the slight dimming of a star when a planet passes in front of it. By analyzing these changes, scientists can calculate the size of the planet and the length of its orbit."},
{id:"c6",title:"Why Cities Grow Where They Do",text:"Cities often grow around locations that offer natural advantages for trade. A protected harbor, a navigable river, or a crossroads between major routes can attract merchants and workers. Once a market is established, businesses tend to cluster nearby to reach more customers. Over time, this concentration of activity encourages the development of roads, banks, and other services that support further growth."},
{id:"c7",title:"Coral Reefs",text:"Coral reefs are among the most diverse ecosystems on the planet. They are built by tiny animals that produce hard skeletons of calcium carbonate. These structures provide shelter and food for thousands of species of fish and other marine life. However, reefs are very sensitive to changes in water temperature, and even a small increase can cause corals to lose the algae they depend on."},
{id:"c8",title:"Language Change",text:"Languages are constantly changing, even if the changes are hard to notice within a single lifetime. New words enter a language to describe new technologies, while older words may fall out of use. Pronunciation can also shift gradually as younger speakers adopt different habits. Linguists compare written records from different periods to trace these patterns and understand how languages develop."}
];

{id:"a1",title:"The Domestication of the Horse",paragraphs:[
"For most of human history, horses were hunted for meat rather than ridden. Archaeological evidence suggests that the domestication of the horse began on the grasslands of Central Asia, known as the steppe, roughly 5,500 years ago. At a site called Botai in present-day Kazakhstan, researchers discovered thousands of horse bones along with traces of mare's milk on ancient pottery, which indicates that people were keeping horses rather than simply hunting them.",
"However, genetic studies have complicated this picture. When scientists analyzed DNA from the Botai horses, they found that these animals were not the ancestors of modern domestic horses. Instead, they were more closely related to Przewalski's horse, a population that still survives in Mongolia. Modern domestic horses appear to descend from a different population that spread rapidly across Eurasia about 4,200 years ago.",
"The spread of this lineage had profound consequences. Horses allowed people to travel much greater distances, transport goods, and communicate across vast regions. They also transformed warfare, as mounted fighters and horse-drawn chariots gave some societies a decisive military advantage. Some historians argue that the movement of horse-riding peoples helped spread languages and technologies throughout Europe and Asia.",

{id:"a2",title:"Urban Heat Islands",paragraphs:[
"Cities are often several degrees warmer than the surrounding countryside, a phenomenon known as the urban heat island effect. The difference is usually most noticeable at night. During the day, dark surfaces such as asphalt roads and rooftops absorb large amounts of solar energy. After sunset, these materials slowly release the stored heat, keeping urban air warm long after rural areas have cooled.",
"Several factors contribute to this effect. Buildings and pavement replace vegetation, which normally cools the air through evapotranspiration, a process in which plants release water vapor. Tall buildings can also trap heat and block wind that would otherwise carry it away. In addition, vehicles, air conditioners, and factories generate waste heat that raises the temperature of the city.",
"Higher urban temperatures have serious consequences. They increase energy demand, as residents rely more heavily on air conditioning during hot weather. They can also worsen air quality, because heat speeds up the chemical reactions that form ground-level ozone. Most importantly, extreme heat poses a health risk, particularly for elderly people and those without access to cooling.",
"Fortunately, cities can take steps to reduce the effect. Planting trees and creating parks restore some of the cooling provided by vegetation. Some cities have also introduced cool roofs, which are coated with reflective materials that absorb less sunlight. Although such measures cannot eliminate the heat island entirely, they can lower temperatures enough to make a meaningful difference."],
questions:[

 {q:"All of the following are mentioned in paragraph 2 as causes of the effect EXCEPT",opts:["the replacement of vegetation with pavement","buildings that block the wind","waste heat from vehicles and machines","increased rainfall in urban areas"],a:3,exp:"植生の減少・風を遮る建物・排熱は本文にある。降水量の話はない。"},
 {q:"According to paragraph 3, how do higher temperatures affect air quality?",opts:["They cause more dust to enter the air.","They speed up reactions that form ground-level ozone.","They reduce the amount of oxygen in the air.","They prevent pollutants from leaving the city."],a:1,exp:"「heat speeds up the chemical reactions that form ground-level ozone」。"},

 {sp:"Professor",text:"So why would an animal make light in a place where there's almost no light at all? There are a few main reasons. One is to attract prey. The anglerfish, for example, has a glowing lure that hangs in front of its mouth. Small fish swim toward the light, and, well, you can guess what happens next."},

 {sp:"Professor",text:"Let's turn to something that's directly relevant to all of you as students: the spacing effect. This is the finding that information is remembered better when study sessions are spread out over time, rather than crammed into a single session."},
 {sp:"Professor",text:"The effect was first described in the 1880s by the German psychologist Hermann Ebbinghaus, who tested his own memory using lists of nonsense syllables. He found that he needed fewer total repetitions to learn a list when he spread his practice over several days. Since then, the spacing effect has been confirmed in hundreds of studies, with all kinds of material: vocabulary, math, even motor skills."},
 {sp:"Professor",text:"Now, why does it work? One explanation is that when you return to material after a delay, you have to work a little harder to retrieve it, and that effort strengthens the memory. So if cramming the night before an exam feels productive, well, it may help you the next morning, but you'll probably forget most of it within a week."}],

const INT = [0, 1, 2, 4, 8, 16, 32];
const KNOWN_DAYS = 120, NEW_PER_DAY = 10;

/* level is derived, never stored: built-in and AI-added words are "adv", VOCAB_BASIC is "basic"; the first spelling (case-insensitive) wins, advanced first */
function allWords() {
  const seen = new Set(), out = [];
  const add = (w, pos, ja, ex, lv) => { const k = String(w).toLowerCase(); if (seen.has(k)) return; seen.add(k); out.push({w, pos, ja, ex, lv}); };
  VOCAB.forEach(([w, pos, ja, ex]) => add(w, pos, ja, ex, "adv"));
  S.customVocab.forEach(x => add(x.w, x.pos, x.ja, x.ex, "adv"));
  VOCAB_BASIC.forEach(([w, pos, ja, ex]) => add(w, pos, ja, ex, "basic"));
  return out;
}
function findWord(w) { return allWords().find(x => x.w === w); }
const lvOK = x => S.prefs.vlevel === "all" || x.lv === S.prefs.vlevel;
const vWords = () => allWords().filter(lvOK);
/* up to n unseen words under the level filter; with "all" they alternate basic / advanced (each pool shuffled), the other pool fills in when one runs dry */
function pickNew(n, skip, first) {
  const ws = vWords().filter(x => !S.vocab[x.w] && !(skip && skip.includes(x.w)));
  const pools = {basic:shuffle(ws.filter(x => x.lv === "basic")), adv:shuffle(ws.filter(x => x.lv === "adv"))};
  let turn = first || "basic"; const out = [];
  while (out.length < n && (pools.basic.length || pools.adv.length)) {
    const p = pools[turn].length ? pools[turn] : pools[turn === "basic" ? "adv" : "basic"];
    out.push(p.shift().w); turn = turn === "basic" ? "adv" : "basic";
  }
  return out;
}
const dueWords = () => { const now = Date.now(); return vWords().filter(x => S.vocab[x.w] && S.vocab[x.w].due <= now).sort((a, b) => S.vocab[a.w].due - S.vocab[b.w].due); };
function buildQueue(extraNew) {

}
/* cards still available today (does not depend on the shuffle) */
function vocabLeft() { return dueWords().length + Math.min(Math.max(0, NEW_PER_DAY - dayCount("vnew")), vWords().filter(x => !S.vocab[x.w]).length); }
/* top up the queue by one unseen word after a "known" dismissal, continuing the basic / advanced alternation */
function topUp() {
  const un = (UI.vq || []).map(findWord).filter(x => x && !S.vocab[x.w]);
  const nb = un.filter(x => x.lv === "basic").length, na = un.length - nb;
  const w = pickNew(1, UI.vq, nb <= na ? "basic" : "adv")[0];
  if (w) UI.vq.push(w);

}
/* keep the queue honest: add words that have fallen due since it was built; rebuild when it ran dry but cards are still available */
function syncQueue() {

  dueWords().forEach(x => { if (!UI.vq.includes(x.w)) UI.vq.push(x.w); });

}

function buildCTest(text) {
  const sents = text.match(/[^.!?]+[.!?]+["')\]]*\s*/g) || [text];
  const joined = sents.join(""); if (joined.length < text.length) sents.push(text.slice(joined.length));
  let html = "", blanks = [], cnt = 0;
  sents.forEach((s, si) => {
    if (si === 0 || blanks.length >= 10) { html += esc(s); return; }
    s.split(/(\s+)/).forEach(tok => {
      const m = tok.match(/^([^A-Za-z]*)([A-Za-z]+)([^A-Za-z]*)$/);
      if (!m || m[2].length < 2 || blanks.length >= 10) { html += esc(tok); return; }
      cnt++;
      if (cnt % 2 === 0) {
        const w = m[2], k = Math.floor(w.length / 2), shown = w.slice(0, k), miss = w.slice(k), i = blanks.length;
        blanks.push(miss);
        html += esc(m[1]) + `<span class="ct">${esc(shown)}<input data-i="${i}" maxlength="${miss.length}" style="width:${miss.length * 0.62 + 0.9}em" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="${esc(shown)}の続き（${miss.length}文字）"></span>` + esc(m[3]);
      } else html += esc(tok);
    });
  });
  return {html, blanks};
}

  const P = pool("ctw"); if (UI.ctw.i >= P.length) UI.ctw.i = 0;

const NUMW = {"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","11":"eleven","12":"twelve","15":"fifteen","20":"twenty","30":"thirty","100":"hundred"};
function normW(w) { const x = String(w).toLowerCase().replace(/[’]/g, "'").replace(/[^a-z0-9']/g, ""); return NUMW[x] || x; }
function diffWords(target, said) {
  const raw = String(target).split(/\s+/).filter(Boolean);
  const a = raw.map(normW), b = String(said).split(/\s+/).map(normW).filter(Boolean);
  const n = a.length, m = b.length;
  const dp = Array.from({length:n + 1}, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = (a[i] && a[i] === b[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const hit = a.map(x => !x); let i = 0, j = 0;
  while (i < n && j < m) { if (a[i] && a[i] === b[j]) { hit[i] = true; i++; j++; } else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++; }
  const valid = a.filter(Boolean).length, got = a.filter((x, k) => x && hit[k]).length;
  return {acc: valid ? got / valid : 0, html: raw.map((w, k) => `<span class="${hit[k] ? "hit" : "miss"}">${esc(w)}</span>`).join(" ")};
}

  else if (m.k === "choose") task = (r.plays > 0 || r.reveal || !hasAudio() || answered) ? `<div class="q" style="border-top:0;padding-top:0">${optsHTML(q, r.ans, "rv-ans")}</div>` : `<p class="muted small">再生すると選択肢が表示されます。</p>`;
  else task = `<div class="q"><div class="qt">${esc(q.q)}</div>${optsHTML(q, r.ans, "rv-ans")}</div>`;
  const exp = answered && q ? `<div class="exp">${r.ans === q.a ? "<b>正解。</b>" : "<b>不正解。</b>正解は " + LET[q.a] + "。"}${esc(q.exp || "")}</div>` : "";
  const status = answered ? `<p class="small${r.ok ? "" : " muted"}">${r.ok ? "リストから外しました。" : "リストに残ります。次の復習でもう一度出ます。"}</p>${next}` : "";
  return `<div class="card">${top}${body}${task}${exp}${status}</div>`;
}

/* ================= RECORD ================= */
/* #record: lifetime numbers, a calendar heat map (ink only, no highlighter), vocabulary mastery and the per-task table.
   Listening-only days (聞き流し) do not count as studied days; the calendar marks them with a dotted frame. */
const hasRec = k => dayTotal(k) > 0 || dayLsn(k) > 0;
/* Monday-first weeks from the week of the first recorded day up to this week (5 to 10 rows); UI.recDay (or today) gets the ink ring */
function calSVG() {
  const now = new Date(); now.setHours(12, 0, 0, 0);
  const tk = dkey(now), sel = UI.recDay || tk;
  const mon = new Date(now); mon.setDate(mon.getDate() - (mon.getDay() + 6) % 7);
  const first = Object.keys(S.days).filter(hasRec).sort()[0];
  let weeks = 5;
  if (first) { const f = dparse(first); f.setDate(f.getDate() - (f.getDay() + 6) % 7); weeks = clamp((Math.round((mon - f) / (7 * DAY)) + 1) || 5, 5, 10); }
  const X0 = 12, TOP = 18, CW = 40, CH = 34, GAP = 6;
  let s = `<svg class="cal" viewBox="0 0 340 ${TOP + weeks * (CH + GAP)}" aria-label="学習カレンダー">`;
  "月火水木金土日".split("").forEach((c, i) => { s += `<text x="${X0 + i * (CW + GAP) + CW / 2}" y="11">${c}</text>`; });
  const d = new Date(mon); d.setDate(d.getDate() - (weeks - 1) * 7);
  for (let i = 0; i < weeks * 7; i++) {
    const k = dkey(d), t = dayTotal(k), x = X0 + (i % 7) * (CW + GAP), y = TOP + Math.floor(i / 7) * (CH + GAP);
    const lv = t >= 45 ? 4 : t >= 30 ? 3 : t >= 15 ? 2 : t >= 1 ? 1 : 0;
    const fut = k > tk, ls = lv === 0 && dayLsn(k) >= 1;
    const label = k === tk ? `<text class="td" x="${x + CW / 2}" y="${y + 20.5}">今日</text>`
      : `<text class="n" x="${x + CW / 2}" y="${y + 21}">${d.getDate() === 1 || i === 0 ? (d.getMonth() + 1) + "/" + d.getDate() : d.getDate()}</text>`;
    s += `<g class="l${lv}${ls ? " ls" : ""}${fut ? " fut" : ""}"${fut ? "" : ' data-act="rec-day"'} data-d="${k}">`
      + (k === sel ? `<rect class="ring" x="${x - 2.5}" y="${y - 2.5}" width="${CW + 5}" height="${CH + 5}" rx="7"/>` : "")
      + `<rect class="c" x="${x}" y="${y}" width="${CW}" height="${CH}" rx="5"/>${label}</g>`;
    d.setDate(d.getDate() + 1);
  }
  return s + "</svg>";
}
/* the picked day: total, then every counter of that day */

/* ================= LISTEN ================= */
/* hands-free: the vocabulary read English → Japanese, 20 items twice, then the next 20. The engine is Lsn (AUDIO section). */
const jaOf = item => (item && (VOCAB_JA[item.w] || VOCAB_JA[String(item.w).toLowerCase()])) || null;
/* a dictionary gloss made speakable (AI-added words have no VOCAB_JA entry) */
const sayable = s => String(s || "").replace(/（[^）]*）|\([^)]*\)/g, "").replace(/[〜~]/g, "").replace(/[・／/;；,]/g, "、").trim();
/* mode "recall" puts a silent pause after every English line: think of the meaning after the headword, repeat the example under your breath */
function lsnSteps(item, pat, mode = "flow") {
  if (!item) return [];
  const j = jaOf(item), say = j && j.say ? j.say : sayable(item.ja), jx = j && j.ex ? j.ex : "";
  const L = pat === "ex" ? [["en", item.ex, "say"], ["ja", jx]] : [["en", item.w, "think"], ["ja", say], ["en", item.ex, "say"], ["ja", jx]];
  const out = [];
  L.forEach(([lang, t, kind]) => {
    const text = String(t || "").trim(); if (!text) return;
    out.push({lang, text});
    if (mode !== "recall" || lang !== "en") return;
    out.push(kind === "think" ? {lang:"wait", kind, text:"意味は？", ms:LSN_T.think} : {lang:"wait", kind, text:"小声で繰り返す", ms:clamp(text.length * 75 + 1000, 2500, 8000)});
  });
  return out;
}
const lsnKey = () => S.prefs.lpat + "|" + S.prefs.lscope + "|" + S.prefs.vlevel;
function lsnPool() {
  const okEx = x => S.prefs.lpat !== "ex" || (String(x.ex || "").trim() && jaOf(x) && jaOf(x).ex);
  let all = S.prefs.lscope === "all", note = "", ws = [];
  if (!all) {
    ws = vWords().filter(x => S.vocab[x.w] && !S.vocab[x.w].kn && okEx(x))
      .sort((a, b) => (S.vocab[a.w].b - S.vocab[b.w].b) || (S.vocab[a.w].due - S.vocab[b.w].due));
    if (!ws.length) { all = true; note = "学習中の語がまだないので、すべての語から流します"; }
  }
  if (all) ws = shuffle(vWords().filter(okEx));
  return {list:ws.map(x => x.w), note, all};
}
/* recall mode shows the lines only up to the current one (the answer must not be visible early); a pause line shows only while it is the current line */
function lsnNowHTML() {
  const L = UI.lsn, on = Lsn.state !== "idle", recall = S.prefs.lmode === "recall";
  return Lsn.steps().map((s, k) => {
    if (recall && k > L.step) return "";
    if (s.lang === "wait") return on && k === L.step ? `<p class="g cur" lang="ja">${esc(s.text)}</p>` : "";
    const cls = s.lang === "ja" ? "j" : k === 0 && S.prefs.lpat === "word" ? "w" : "s";
    return `<p class="${cls}${on && k === L.step ? " cur" : ""}" lang="${s.lang}">${esc(s.text)}</p>`;
  }).join("");
}
function lsnProgText() { const L = UI.lsn; return L ? `${L.i + 1} / ${Lsn.batch().length} ・ ${L.round}周目` : ""; }
function listenView() {

/* Fallback dictation for the stand-alone app (GitHub Pages / home screen). Mirrors the claude "dictation" API used by Dict. */
function webSpeechDict() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR || IN_CLAUDE) return null;
  const cb = {partial:[], final:[], state:[]};
  const emit = (k, v) => cb[k].forEach(f => { try { f(v); } catch (e) {} });
  let rec = null;
  return {
    onPartial(f) { cb.partial.push(f); }, onFinal(f) { cb.final.push(f); }, onState(f) { cb.state.push(f); },
    start() {
      return new Promise((res, rej) => {
        try {
          rec = new SR(); rec.lang = "en-US"; rec.interimResults = true; rec.continuous = true;
          rec.onstart = () => { emit("state", {state:"listening"}); res(); };
          rec.onresult = e => { let interim = ""; for (let i = e.resultIndex; i < e.results.length; i++) { const r = e.results[i]; if (r.isFinal) emit("final", {text:r[0].transcript.trim()}); else interim += r[0].transcript; } emit("partial", {text:interim.trim()}); };
          rec.onerror = e => { if (e.error === "not-allowed" || e.error === "service-not-allowed") rej({code:"not_granted"}); };
          rec.onend = () => { rec = null; emit("state", {state:"idle", reason:"stopped"}); };
          rec.start();
        } catch (e) { rej({code:"unavailable"}); }
      });
    },
    stop() { return new Promise(res => { if (!rec) return res(); const r = rec; const prev = r.onend; r.onend = ev => { if (prev) prev(ev); res(); }; try { r.stop(); } catch (e) { res(); } }); }
  };
}

          if (remote.updatedAt > S.updatedAt) {
            S = remote; lsSet(KEY, JSON.stringify(S)); UI.vq = null; UI.vundo = null;
            const r = route(); if (r === "home" || r === "vocab" || r === "record") render(true);
          } else if (S.updatedAt > remote.updatedAt) pushDb();
          setSync("ok");
        } else if (S.updatedAt > 0) pushDb();
        else setSync("ok");
      }
    } catch (e) { setSync("err"); }
  }
  if (route() === "home") render(true);
}

/* ================= BOOT ================= */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") {
    if (Lsn.state === "playing") { Lsn.pause(); UI.lsnHid = true; }   /* speech stops with the screen anyway; no auto-resume */
    Wake.off(); return;
  }
  if (UI.lsnHid) { UI.lsnHid = false; if (Lsn.state === "paused") { Lsn.msg = "画面が消えたので一時停止しました。▶ で続きから"; Lsn.paint(); } }
  if (Timer.id || Speech.playing) Wake.on();
  if (UI.lastDay !== today()) {
    UI.lastDay = today(); UI.vq = null; UI.sess = null; UI.vundo = null;
    const r = route(); if (r === "home" || r === "vocab" || r === "record") render(true);
  }
});
function start(data) {
  if (data && data.ui) ["reading","listening","writing","speaking"].forEach(k => { if (data.ui[k]) UI[k] = data.ui[k]; });
  markCaps();
  render();
  initCaps();
  registerSW();
}
try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ui:{reading:UI.reading, listening:UI.listening, writing:UI.writing, speaking:UI.speaking}})); } catch (e) {}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script>
</body>
